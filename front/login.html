<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - FitPower</title>
    <link rel="icon" type="image/png" href="dist/imagenes/mancuerna.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="dist/css/style.css">
    <link rel="stylesheet" href="dist/css/mobile.css">
</head>

<body>
    <div class="container-fluid p-0">
        <div class="row g-0">

            <div class="col-md-6 login-image d-none d-md-block"></div>

            <!-- Formulario -->
            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center login-form-side">
                <div class="login-form-wrapper">
                    <h2 class="text-primary fw-bold text-center mb-4">Iniciar sesión</h2>

                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Ingresa Email">
                        </div>

                        <div class="mb-4">
                            <label for="socio" class="form-label">Número de socio</label>
                            <input type="text" class="form-control" id="socio" placeholder="Ingresar número de socio">
                        </div>

                        <button type="submit" class="btn btn-primary rounded-pill w-100">Iniciar sesión</button>
                    </form>

                    <div class="text-center mt-4">
                        <img src="dist/imagenes/mancuerna-negro.png" alt="FitPower" class="login-logo">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
